<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>F1 3D Studio Render Harness</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c" width="640" height="320"></canvas>
  <script src="/static/vendor/three.min.js"></script>
  <script src="/static/js/f1_car_3d.js"></script>
  <script>
    (function () {
      var canvas = document.getElementById('c');
      var renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true
      });
      renderer.setPixelRatio(1);
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.24;
      if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) {
        renderer.outputColorSpace = THREE.SRGBColorSpace;
      }

      var scene = new THREE.Scene();
      scene.environment = F1Car3D.createStudioEnvironment(renderer);
      var lights = F1Car3D.addStudioLights(scene, '#ffffff');
      /* Boost studio fill slightly so transparent PNGs read brightly on both dark web cards and white print PDFs */
      lights.key.intensity = 2.6;
      lights.fill.intensity = 1.35;
      lights.rim.intensity = 1.25;

      var carsByKey = {};
      function chassisBucketKey(eraOrYear) {
        if (eraOrYear == null) return '2026';
        var s = String(eraOrYear).trim();
        var m = s.match(/^(\d{4})$/);
        if (!m) return s || '2020s';
        var y = parseInt(m[1], 10);
        if (y <= 1960) return '1955';
        if (y <= 1967) return '1965';
        if (y <= 1970) return '1968';
        if (y <= 1972) return '1971';
        if (y <= 1979) return '1975';
        if (y <= 1988) return '1988';
        if (y <= 1993) return '1991';
        if (y <= 1997) return '1995';
        if (y <= 2005) return '2004';
        if (y <= 2008) return '2008';
        if (y <= 2013) return '2012';
        if (y <= 2016) return '2014';
        if (y === 2017) return '2017';
        if (y <= 2021) return '2020';
        if (y <= 2025) return '2024';
        return '2026';
      }
      function getCarForEra(eraOrYear) {
        var key = chassisBucketKey(eraOrYear);
        if (!carsByKey[key]) {
          var arg = /^\d{4}$/.test(key) ? parseInt(key, 10) : key;
          var c = F1Car3D.createCar({}, 'modern', arg);
          c.visible = false;
          scene.add(c);
          carsByKey[key] = c;
        }
        return carsByKey[key];
      }
      var activeCar = getCarForEra(2026);
      activeCar.visible = true;
      var shadow = F1Car3D.createContactShadow();
      shadow.material.opacity = 0.55;
      scene.add(shadow);

      var camera = new THREE.PerspectiveCamera(26, 2, 0.1, 100);

      function setCamera(presetName, width, height) {
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        var pr = F1Car3D.CAMERA_PRESETS[presetName] || { theta: 0.88, phi: 0.22, radius: 6.75, targetY: 0.44 };
        /* Card/PDF 2:1 framing: centered dynamic 3/4 front-side angle filling the frame cleanly */
        if (presetName === 'card') {
          pr = { theta: 0.92, phi: 0.22, radius: 6.55, targetY: 0.44 };
        }
        var y = pr.radius * Math.sin(pr.phi) + pr.targetY;
        var r = pr.radius * Math.cos(pr.phi);
        camera.position.set(r * Math.sin(pr.theta), y, r * Math.cos(pr.theta));
        camera.lookAt(0, pr.targetY, 0.12);
      }

      window.renderLiveryPng = function (palette, presetName, width, height, styleName, eraOrYear, finishName) {
        width = width || 640;
        height = height || 320;
        var nextCar = getCarForEra(eraOrYear || 2026);
        if (activeCar !== nextCar) {
          activeCar.visible = false;
          nextCar.visible = true;
          activeCar = nextCar;
        }
        activeCar.userData.setPalette(palette, styleName || 'modern', finishName || undefined);
        if (palette && palette.main) {
          lights.rim.color.set(palette.main);
        }
        setCamera(presetName || 'card', width, height);
        renderer.render(scene, camera);
        return canvas.toDataURL('image/png');
      };

      window.__HARNESS_READY__ = true;
    })();
  </script>
</body>
</html>
