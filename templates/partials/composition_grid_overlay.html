{# Shared composition overlay: 5×5 cell grid + centre + tyre guides.
   Guides match f1_car_front.html grid map (viewBox 220×160 → % of stage).
   Cyan  ≈ front tyre centres (x 32/188 → ~14.5%/85.5%)
   Green ≈ front-tyre inner / intake outer (x 48/172 → ~22%/78%)
#}
<div class="comp-overlay" aria-hidden="true">
  <svg viewBox="0 0 100 100" preserveAspectRatio="none">
    {% for row in range(5) %}
      {% for col in range(5) %}
        {% if (row + col) % 2 == 0 %}
        <rect x="{{ col * 20 }}" y="{{ row * 20 }}" width="20" height="20"
              fill="rgba(0,0,0,0.05)"/>
        {% endif %}
      {% endfor %}
    {% endfor %}

    {% for i in range(1, 5) %}
    <line x1="0" y1="{{ i * 20 }}" x2="100" y2="{{ i * 20 }}"
          stroke="rgba(15,20,30,0.55)" stroke-width="0.4"/>
    <line x1="{{ i * 20 }}" y1="0" x2="{{ i * 20 }}" y2="100"
          stroke="rgba(15,20,30,0.55)" stroke-width="0.4"/>
    {% endfor %}
    <rect x="0.2" y="0.2" width="99.6" height="99.6"
          fill="none" stroke="rgba(15,20,30,0.5)" stroke-width="0.45"/>

    <line x1="50" y1="0" x2="50" y2="100"
          stroke="#e10600" stroke-width="0.55" stroke-dasharray="1.4 0.9"/>

    <g class="comp-guides">
      {# blue = rear OUTER (near canvas edges — vector ref) #}
      <line x1="1" y1="0" x2="1" y2="100" stroke="#0891b2" stroke-width="0.45"
            stroke-dasharray="0.9 0.7" opacity="0.95"/>
      <line x1="99" y1="0" x2="99" y2="100" stroke="#0891b2" stroke-width="0.45"
            stroke-dasharray="0.9 0.7" opacity="0.95"/>
      {# green = rear INNER / front-tyre mid (C1–C2 & C4–C5) #}
      <line x1="20" y1="0" x2="20" y2="100" stroke="#65a30d" stroke-width="0.4"
            stroke-dasharray="0.7 1" opacity="0.9"/>
      <line x1="80" y1="0" x2="80" y2="100" stroke="#65a30d" stroke-width="0.4"
            stroke-dasharray="0.7 1" opacity="0.9"/>
    </g>
  </svg>
</div>
